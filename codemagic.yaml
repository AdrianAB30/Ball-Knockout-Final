workflows:
  unity_ios:
    name: Unity iOS Build
    environment:
      vars:
        UNITY_VERSION: "2022.3.45f1"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Activate Unity License
        script: |
          echo "Activating Unity License"
      - name: Build iOS Player
        script: |
          /Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -quit \
            -projectPath . \
            -buildTarget iOS \
            -executeMethod BuildScript.BuildIOS
    artifacts:
      - build/ios/**
    publishing:
      email:
        recipients:
          - "tu_correo@gmail.com"
